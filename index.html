<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julie Spira · midee</title>
<meta name="description" content="Ableton Templates Library inspired by real tracks from the dancefloor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #151517; --text: #edecec; --muted: #edecec99; --lavender: #c4b5fd; --line: #edecec26; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "DM Sans", system-ui, sans-serif; letter-spacing: -.2px; min-height: 100vh; display: flex; justify-content: center; }
  main { width: 100%; max-width: 440px; padding: 56px 24px 40px; display: flex; flex-direction: column; gap: 28px; }
  .brand { color: var(--lavender); font-weight: 600; font-size: 22px; letter-spacing: -.5px; }
  .what { color: var(--muted); font-size: 17px; line-height: 1.4; margin-top: 8px; }
  h1 { font-size: 40px; font-weight: 500; letter-spacing: -1.4px; line-height: 1.05; }
  .role { color: var(--lavender); font-size: 17px; margin-bottom: 4px; }
  .hook { color: var(--lavender); font-size: 17px; line-height: 1.4; }
  nav { display: flex; flex-direction: column; gap: 12px; }
  a.btn { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border: 1px solid var(--line); border-radius: 14px; color: var(--text); text-decoration: none; font-size: 17px; transition: border-color .15s, background .15s; }
  a.btn small { color: var(--muted); font-size: 15px; }
  a.btn:hover, a.btn:focus-visible { border-color: var(--lavender); background: #c4b5fd14; outline: none; }
  a.btn.main { background: var(--lavender); color: var(--bg); border-color: var(--lavender); font-weight: 500; }
  a.btn.main small { color: #151517b3; }
  footer { color: var(--muted); font-size: 15px; margin-top: auto; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div>
    <div class="brand">midee</div>
    <p class="what">Ableton Templates Library inspired by real tracks from the dancefloor</p>
  </div>
  <div>
    <div class="role">Founder</div>
    <h1>Julie Spira</h1>
  </div>
  <p class="hook">open ableton first with a sound you already love</p>
  <nav>
    <a class="btn main" href="https://midee.me/">midee.me <small>7,000+ Racks</small></a>
    <a class="btn" href="https://instagram.com/spiraaaaaa">Instagram <small>@spiraaaaaa</small></a>
    <a class="btn" href="mailto:js@midee.me">Email <small>js@midee.me</small></a>
  </nav>
  <footer>© midee</footer>
</main>
</body>
</html>
